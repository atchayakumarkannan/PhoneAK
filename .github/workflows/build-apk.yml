
name: Build Phone AK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build debug APK
        run: |
          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phone-AK-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
